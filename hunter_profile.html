<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hunter Mafia — Profil</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0f0c;
    --bg-1:#121b16;
    --surface:#161f1a;
    --surface-2:#1c2721;
    --hairline:#2a352e;
    --gold:#c9a227;
    --gold-soft:#e8cf7c;
    --blood:#8a2a2a;
    --blood-soft:#c8564f;
    --text-0:#eee7d6;
    --text-1:#b8bfb6;
    --text-2:#7c877e;
    --green-ok:#5c8a5a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #1a2c22 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 60%);
    color:var(--text-0);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }
  .wrap{ max-width:460px; margin:0 auto; padding:22px 18px 0; }

  /* ---------- Hero ---------- */
  .hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 0 6px; }
  .medal{ position:relative; width:168px; height:168px; margin-bottom:14px; }
  .medal svg{ width:100%; height:100%; overflow:visible; }
  .medal .avatar-ring{ fill:none; stroke:url(#goldRing); stroke-width:2.5; }
  .avatar-wrap{
    position:absolute; inset:14px; border-radius:50%; overflow:hidden;
    border:1px solid rgba(201,162,39,.45);
    box-shadow: 0 0 0 6px rgba(10,15,12,.55), 0 12px 30px rgba(0,0,0,.55);
  }
  .avatar-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rank-badge{
    position:absolute; bottom:-2px; left:50%; transform:translateX(-50%);
    background:var(--bg-0); border:1px solid var(--gold); color:var(--gold-soft);
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:.06em;
    padding:3px 10px; border-radius:20px; white-space:nowrap;
  }

  .name{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    font-size:30px; letter-spacing:.02em; color:var(--text-0); margin:6px 0 2px; }
  .uid{ font-size:12px; color:var(--text-2); letter-spacing:.03em; margin-bottom:14px; }

  .status-row{ display:flex; flex-direction:column; gap:8px; width:100%; margin-bottom:16px; }
  .pill{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:12px; padding:11px 14px; font-size:14px;
  }
  .pill .left{ display:flex; align-items:center; gap:9px; color:var(--text-1); }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--green-ok); box-shadow:0 0 6px var(--green-ok); }
  .pill.vip .left{ color:var(--gold-soft); }
  .vip-days{ font-size:12px; color:var(--text-2); }

  /* ---------- Live coin rate ticker (yangi funksiya) ---------- */
  .ticker{
    display:flex; align-items:center; gap:10px; background:var(--surface-2);
    border:1px solid var(--hairline); border-radius:12px; padding:10px 14px; margin-bottom:16px;
  }
  .ticker .coin-icon{ font-size:18px; }
  .ticker .rate{ font-size:13px; color:var(--text-1); flex:1; }
  .ticker .rate b{ color:var(--text-0); font-weight:600; }
  .ticker .trend{ font-size:12px; font-weight:600; padding:3px 8px; border-radius:8px; }
  .trend.up{ color:#7fbf7a; background:rgba(92,138,90,.16); }
  .trend.down{ color:var(--blood-soft); background:rgba(138,42,42,.16); }
  .trend.flat{ color:var(--text-2); background:rgba(124,135,126,.14); }

  /* ---------- Balances ---------- */
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px; }
  .balance-card{
    background:var(--surface); border:1px solid var(--hairline); border-radius:14px;
    padding:14px 6px 12px; text-align:center;
  }
  .balance-card .ic{ font-size:22px; display:block; margin-bottom:6px; }
  .balance-card .label{ font-size:10.5px; color:var(--text-2); letter-spacing:.04em; margin-bottom:4px; }
  .balance-card .val{ font-family:'Cinzel', serif; font-size:16px; font-weight:600; color:var(--text-0); }
  .balance-card.gold .val{ color:var(--gold-soft); }
  .balance-card.blue .val{ color:#7fb8d6; }

  .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--hairline); border-radius:14px;
    padding:12px 4px 10px; text-align:center;
  }
  .stat-card .ic{ font-size:17px; display:block; margin-bottom:5px; }
  .stat-card .val{ font-size:15px; font-weight:700; }
  .stat-card .label{ font-size:9px; color:var(--text-2); letter-spacing:.03em; margin-top:3px; }
  .stat-card.win .val{ color:var(--gold-soft); }
  .stat-card.loss .val{ color:var(--blood-soft); }
  .rating-stars{ letter-spacing:1px; font-size:12px; color:var(--gold); }

  /* ---------- Achievements (yangi funksiya) ---------- */
  .section-title{
    font-family:'Cormorant Garamond', serif; font-size:17px; font-style:italic;
    color:var(--text-1); margin:4px 2px 10px;
  }
  .badges{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; }
  .badges::-webkit-scrollbar{ display:none; }
  .badge{
    flex:0 0 auto; width:70px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .badge .circle{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:22px; background:var(--surface-2); border:1px solid var(--hairline);
  }
  .badge.unlocked .circle{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,.12); }
  .badge.locked .circle{ opacity:.35; filter:grayscale(1); }
  .badge .cap{ font-size:9.5px; color:var(--text-2); text-align:center; line-height:1.2; }

  /* ---------- Edit button ---------- */
  .edit-btn{
    display:block; width:100%; text-align:center; padding:13px; border-radius:12px;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#1a1406; font-weight:700; font-size:14px; border:none; letter-spacing:.02em;
    margin-bottom:26px;
  }
  .edit-btn:active{ filter:brightness(.92); }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; background:rgba(10,15,12,.92);
    backdrop-filter:blur(10px); border-top:1px solid var(--hairline);
    display:flex; justify-content:space-around; padding:10px 6px calc(10px + env(safe-area-inset-bottom));
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-2); font-size:10px; }
  .nav-item .ic{ font-size:19px; }
  .nav-item.active{ color:var(--gold-soft); }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div class="medal">
      <svg viewBox="0 0 168 168">
        <defs>
          <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e8cf7c"/>
            <stop offset="50%" stop-color="#c9a227"/>
            <stop offset="100%" stop-color="#8a6f1c"/>
          </linearGradient>
        </defs>
        <!-- tashqi lavr (laurel) shoxchalar — Almex'dagi qanotlar o'rniga original hunter-medal uslubi -->
        <g stroke="url(#goldRing)" stroke-width="2" fill="none" opacity="0.85">
          <path d="M14 84 C 8 68, 10 50, 22 36" stroke-linecap="round"/>
          <path d="M20 40 C 16 40, 12 36, 12 30" stroke-linecap="round"/>
          <path d="M26 30 C 22 32, 17 30, 16 24" stroke-linecap="round"/>
          <path d="M33 22 C 29 25, 24 24, 22 18" stroke-linecap="round"/>
          <path d="M154 84 C 160 68, 158 50, 146 36" stroke-linecap="round"/>
          <path d="M148 40 C 152 40, 156 36, 156 30" stroke-linecap="round"/>
          <path d="M142 30 C 146 32, 151 30, 152 24" stroke-linecap="round"/>
          <path d="M135 22 C 139 25, 144 24, 146 18" stroke-linecap="round"/>
        </g>
        <circle class="avatar-ring" cx="84" cy="84" r="68"/>
        <circle cx="84" cy="16" r="3.2" fill="var(--gold-soft)"/>
      </svg>
      <div class="avatar-wrap">
        <img id="avatarImg" src="https://api.dicebear.com/7.x/shapes/svg?seed=hunter" alt="avatar">
      </div>
      <div class="rank-badge" id="rankBadge">FAOL OVCHI</div>
    </div>

    <div class="name" id="userName">Ovchi</div>
    <div class="uid" id="userId">ID: —</div>
  </div>

  <div class="status-row">
    <div class="pill">
      <div class="left"><span class="dot"></span><span>Faol o'yinchi</span></div>
    </div>
    <div class="pill vip" id="vipPill" style="display:none;">
      <div class="left">👑 <span>HUNTER ELITE</span></div>
      <div class="vip-days" id="vipDays">— kun qoldi</div>
    </div>
  </div>

  <!-- 🆕 Jonli Hunter Coin kursi — botdagi /kurs bilan bir xil ma'lumot -->
  <div class="ticker">
    <span class="coin-icon">🪙</span>
    <div class="rate">1 Coin = <b id="rateDiamond">—</b> 💎 &nbsp;•&nbsp; <b id="rateDollar">—</b> 💵</div>
    <span class="trend flat" id="trendBadge">—</span>
  </div>

  <div class="grid3">
    <div class="balance-card">
      <span class="ic">💵</span>
      <div class="label">DOLLAR</div>
      <div class="val" id="balDollar">0</div>
    </div>
    <div class="balance-card gold">
      <span class="ic">🪙</span>
      <div class="label">HUNTER COIN</div>
      <div class="val" id="balCoin">0</div>
    </div>
    <div class="balance-card blue">
      <span class="ic">💎</span>
      <div class="label">OLMOS</div>
      <div class="val" id="balDiamond">0</div>
    </div>
  </div>

  <div class="grid4">
    <div class="stat-card win">
      <span class="ic">🏆</span>
      <div class="val" id="statWins">0</div>
      <div class="label">G'ALABA</div>
    </div>
    <div class="stat-card">
      <span class="ic">🎮</span>
      <div class="val" id="statGames">0</div>
      <div class="label">O'YINLAR</div>
    </div>
    <div class="stat-card loss">
      <span class="ic">💀</span>
      <div class="val" id="statLosses">0</div>
      <div class="label">MAG'LUBIYAT</div>
    </div>
    <div class="stat-card">
      <div class="rating-stars" id="ratingStars">☆☆☆☆☆</div>
      <div class="val" id="ratingPct" style="margin-top:4px;">0%</div>
      <div class="label">REYTING</div>
    </div>
  </div>

  <div class="section-title">Yutuqlar</div>
  <div class="badges" id="badgesRow"></div>

  <button class="edit-btn" onclick="Telegram.WebApp?.HapticFeedback?.impactOccurred('light')">Profilni tahrirlash</button>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><span class="ic">👤</span><span>Profil</span></div>
  <div class="nav-item"><span class="ic">🛒</span><span>Do'kon</span></div>
  <div class="nav-item"><span class="ic">🏛</span><span>Klan</span></div>
  <div class="nav-item"><span class="ic">🏆</span><span>Reyting</span></div>
  <div class="nav-item"><span class="ic">🎮</span><span>O'yin</span></div>
</div>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  // ------------------------------------------------------------------
  // MOCK / NAMUNA MA'LUMOT — haqiqiy ishlashi uchun bu joyni botning
  // API endpoint'iga ulash kerak (masalan fetch('/api/profile?uid=...')).
  // Field nomlari botdagi user_dict() natijasiga mos qilib tanlangan.
  // ------------------------------------------------------------------
  const MOCK_PROFILE = {
    name: "Ovchi",
    uid: 6384925520,
    avatar: "https://api.dicebear.com/7.x/shapes/svg?seed=hunter",
    vip_days_left: 13,
    dollar: 1322,
    coin: 84,
    diamond: 740,
    wins: 18,
    games: 81,
    losses: 63,
    rating_pct: 22,
    badges: [
      {icon:"🎯", label:"Birinchi ov", unlocked:true},
      {icon:"🐺", label:"10 g'alaba", unlocked:true},
      {icon:"🏹", label:"Snayper", unlocked:true},
      {icon:"👑", label:"ELITE", unlocked:true},
      {icon:"🏛", label:"Klan lideri", unlocked:false},
      {icon:"💎", label:"100 Olmos", unlocked:false},
    ],
  };

  const MOCK_RATE = { diamond: 2.0, dollar: 60.0, prev_diamond: 2.1, prev_dollar: 58.5 };

  function renderProfile(p){
    document.getElementById('userName').textContent = p.name;
    document.getElementById('userId').textContent = 'ID: ' + p.uid;
    document.getElementById('avatarImg').src = p.avatar;
    document.getElementById('balDollar').textContent = p.dollar.toLocaleString('ru-RU');
    document.getElementById('balCoin').textContent = p.coin.toLocaleString('ru-RU');
    document.getElementById('balDiamond').textContent = p.diamond.toLocaleString('ru-RU');
    document.getElementById('statWins').textContent = p.wins;
    document.getElementById('statGames').textContent = p.games;
    document.getElementById('statLosses').textContent = p.losses;
    document.getElementById('ratingPct').textContent = p.rating_pct + '%';
    const fullStars = Math.round(p.rating_pct / 20);
    document.getElementById('ratingStars').textContent = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);

    if (p.vip_days_left && p.vip_days_left > 0){
      document.getElementById('vipPill').style.display = 'flex';
      document.getElementById('vipDays').textContent = p.vip_days_left + ' kun qoldi';
      document.getElementById('rankBadge').textContent = 'HUNTER ELITE';
    }

    const row = document.getElementById('badgesRow');
    row.innerHTML = '';
    p.badges.forEach(b => {
      const el = document.createElement('div');
      el.className = 'badge ' + (b.unlocked ? 'unlocked' : 'locked');
      el.innerHTML = `<div class="circle">${b.icon}</div><div class="cap">${b.label}</div>`;
      row.appendChild(el);
    });
  }

  function renderRate(r){
    document.getElementById('rateDiamond').textContent = r.diamond.toFixed(2);
    document.getElementById('rateDollar').textContent = r.dollar.toFixed(0);
    const badge = document.getElementById('trendBadge');
    if (r.diamond > r.prev_diamond){ badge.textContent = '▲'; badge.className = 'trend up'; }
    else if (r.diamond < r.prev_diamond){ badge.textContent = '▼'; badge.className = 'trend down'; }
    else { badge.textContent = '➡️'; badge.className = 'trend flat'; }
  }

  // Haqiqiy backend ulanganda shu ikki funksiyani fetch() bilan almashtiring:
  // fetch('/api/profile?uid=' + tg.initDataUnsafe.user.id).then(r=>r.json()).then(renderProfile)
  // fetch('/api/hc_rate').then(r=>r.json()).then(renderRate)
  renderProfile(MOCK_PROFILE);
  renderRate(MOCK_RATE);

  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
    const u = tg.initDataUnsafe.user;
    document.getElementById('userName').textContent = [u.first_name, u.last_name].filter(Boolean).join(' ');
    document.getElementById('userId').textContent = 'ID: ' + u.id;
    if (u.photo_url) document.getElementById('avatarImg').src = u.photo_url;
  }
</script>
</body>
</html>
